# ros2_control configuration for the MAGI Go2W in Gazebo Sim.
#
# Loaded by the gz_ros2_control system plugin (see go2w_gazebo.xacro), which
# creates the controller_manager node inside the Gazebo process.
#
# Control split:
#   leg_controller    12 leg joints, EFFORT interface, joint-level PD
#   wheel_controller  4 wheels, velocity interface, skid-steer from /cmd_vel

controller_manager:
  ros__parameters:
    update_rate: 500  # Hz
    use_sim_time: true

    # NOTE: position_proportional_gain is deliberately absent. It only affects
    # gz_ros2_control's POSITION branch, and no joint uses a position command
    # interface any more -- legs are effort, wheels are velocity.

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

    leg_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    wheel_controller:
      type: diff_drive_controller/DiffDriveController


joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true


imu_sensor_broadcaster:
  ros__parameters:
    use_sim_time: true
    sensor_name: imu_sensor
    frame_id: imu


# ---------------------------------------------------------------------------
# Legs: 12 joints under joint-level PD on the EFFORT interface.
#
# In effort mode joint_trajectory_controller emits
#     tau = p*(q_des - q) + i*integral + d*(dq_des - dq)
#           + ff_velocity_scale*dq_des
# which is the same law the real Unitree motor runs from its MotorCmd
# (q, dq, tau, kp, kd). The legs therefore behave like actuators rather than
# the rigid velocity constraints the position interface produced.
#
# Gain sizing. Joint stiffness maps to contact stiffness as k = p / lever^2.
# The calf works through a 0.1535 m lever in stance, so p = 200 gives
# 200/0.1535^2 ~ 8500 N/m at the wheel, i.e. ~5.7 mm of travel under the 48.5 N
# per-leg load. That is deliberately matched to the Rubicon terrain, whose mean
# facet step is 6.8 mm: the legs absorb the facets instead of bouncing the
# whole robot off them.
#
# Damping: reflected inertia at the joint when carrying the body is roughly
# 19.8 kg * 0.15^2 ~ 0.45 kg.m^2, so critical damping is 2*sqrt(200*0.45) ~ 19.
# d = 10 is under-damped by that measure but over-damped for the unloaded leg;
# it is a compromise, and the first thing to raise if the stance oscillates.
#
# i is left at zero for now. Gravity hold needs ~5.7 N.m at the calf, which at
# p = 200 shows up as ~1.6 deg of steady droop; integral action would remove it
# but risks winding up against intermittent ground contact. Revisit only if the
# droop matters.
# ---------------------------------------------------------------------------
leg_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - FL_hip_joint
      - FL_thigh_joint
      - FL_calf_joint
      - FR_hip_joint
      - FR_thigh_joint
      - FR_calf_joint
      - RL_hip_joint
      - RL_thigh_joint
      - RL_calf_joint
      - RR_hip_joint
      - RR_thigh_joint
      - RR_calf_joint
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    # The legs are a compliant servo working against terrain contact, so exact
    # goal tolerances are neither achievable nor useful here.
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0

    gains:
      FL_hip_joint:   {p: 200.0, i: 0.0, d: 10.0, i_clamp: 5.0, ff_velocity_scale: 0.0}
      FL_thigh_joint: {p: 200.0, i: 0.0, d: 10.0, i_clamp: 5.0, ff_velocity_scale: 0.0}
      FL_calf_joint:  {p: 200.0, i: 0.0, d: 10.0, i_clamp: 5.0, ff_velocity_scale: 0.0}
      FR_hip_joint:   {p: 200.0, i: 0.0, d: 10.0, i_clamp: 5.0, ff_velocity_scale: 0.0}
      FR_thigh_joint: {p: 200.0, i: 0.0, d: 10.0, i_clamp: 5.0, ff_velocity_scale: 0.0}
      FR_calf_joint:  {p: 200.0, i: 0.0, d: 10.0, i_clamp: 5.0, ff_velocity_scale: 0.0}
      RL_hip_joint:   {p: 200.0, i: 0.0, d: 10.0, i_clamp: 5.0, ff_velocity_scale: 0.0}
      RL_thigh_joint: {p: 200.0, i: 0.0, d: 10.0, i_clamp: 5.0, ff_velocity_scale: 0.0}
      RL_calf_joint:  {p: 200.0, i: 0.0, d: 10.0, i_clamp: 5.0, ff_velocity_scale: 0.0}
      RR_hip_joint:   {p: 200.0, i: 0.0, d: 10.0, i_clamp: 5.0, ff_velocity_scale: 0.0}
      RR_thigh_joint: {p: 200.0, i: 0.0, d: 10.0, i_clamp: 5.0, ff_velocity_scale: 0.0}
      RR_calf_joint:  {p: 200.0, i: 0.0, d: 10.0, i_clamp: 5.0, ff_velocity_scale: 0.0}


# ---------------------------------------------------------------------------
# Wheels: skid-steer. Both wheels on a side are treated as one virtual wheel;
# diff_drive_controller averages their feedback for odometry.
#
# Geometry measured off left_wheel.dae / the URDF joint tree:
#   radius            0.086 m  (mesh bbox spans +/-0.0860 in the rolling plane)
#   track (separation) 0.380 m  (hip 0.0465 + thigh 0.0955 + mesh centroid 0.0481)
#   wheelbase          0.387 m  (front/rear hips at x = +/-0.1934)
#
# Because all four wheels are fixed and non-steerable, yaw requires lateral tyre
# slip, so real yaw rate falls short of the command. Raise
# wheel_separation_multiplier (~1.3-1.8) to make turning more aggressive; note
# that also makes the reported odometry yaw conservative.
# ---------------------------------------------------------------------------
wheel_controller:
  ros__parameters:
    use_sim_time: true
    left_wheel_names:
      - FL_foot_joint
      - RL_foot_joint
    right_wheel_names:
      - FR_foot_joint
      - RR_foot_joint

    wheel_separation: 0.380
    wheel_radius: 0.086
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base
    # The EKF in magi_localization owns odom -> base. Two publishers of the
    # same transform makes TF non-deterministic, so this controller publishes
    # the odom *message* (which the EKF consumes) but not the transform.
    enable_odom_tf: false
    open_loop: false
    position_feedback: true
    cmd_vel_timeout: 0.5

    # false => subscribe to ~/cmd_vel_unstamped as geometry_msgs/Twist, which is
    # what teleop_twist_keyboard and `ros2 topic pub` produce.
    use_stamped_vel: false

    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    # Measured in Gazebo on flat.sdf, ground truth from the server:
    #   linear  1.0 m/s  -> 0.86-0.95 m/s  (86-95%)
    #   angular 0.5 rad/s -> 0.39 rad/s    (78%)
    #   angular 1.0 rad/s -> 0.78 rad/s    (78%)
    #   angular 1.5 rad/s -> 1.22 rad/s    (81%)
    # with zero stance drop in every case.
    #
    # These limits are conservative rather than a hard boundary. Note the whole
    # picture changes with the wheel *collision* shape: with the upstream mesh
    # collision, yaw managed only ~38% and a spin above 0.8 rad/s saturated the
    # 23.7 N.m hip joints, splayed the legs and dropped the body. The primitive
    # cylinder collision (see gen_body.py) removed that failure entirely.
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 1.5
        min_velocity: -1.5
        has_acceleration_limits: true
        max_acceleration: 1.5
        min_acceleration: -1.5
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 1.5
        min_velocity: -1.5
        has_acceleration_limits: true
        max_acceleration: 2.0
        min_acceleration: -2.0
