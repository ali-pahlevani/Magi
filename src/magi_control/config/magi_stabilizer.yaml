# Tuning for magi_stabilizer.py -- the dynamic tipover-prevention controller.
#
# WHAT THE ROBOT ACTUALLY HAS TO WORK WITH
#
# Computed from the leg IK and the URDF inertials, with the wheel contact taken
# as the true contact of a cambered cylinder rather than "wheel centre minus a
# radius" (splaying the hips leans the wheels, which moves the contact 19 mm
# further out again at full splay -- free track the old node did not count):
#
#   stance                    half-track   h_com   tip angle   lateral accel
#   nominal, ride 0.36          0.1901    0.2711     35.0 deg     6.88 m/s^2
#   widen_max 0.070 (here)      0.2727    0.2724     45.0 deg     9.82 m/s^2
#   widen 0.070 + full crouch   0.2784    0.2224     51.4 deg    12.28 m/s^2
#
# And the axis the table used to leave out, because there is no lever for it:
#
#   nose-up, ride 0.36        atan(0.1934 / 0.2711) = 35.5 deg
#
# Past that the centre of mass is behind the rear contacts and the robot goes
# over its own tail. Widening does nothing for it and the wheelbase is fixed,
# so the only answer is the rear-up guard further down.
#
# WHY THE STANCE IS NARROWER THAN IT USED TO BE
#
# The previous configuration ran ride 0.40 with widen_max 0.110, reaching
# 45.6 deg of roll tipping angle by splaying to a 0.600 m track. Taking 40 mm
# off the ride height instead reaches 45.0 deg at a 0.520 m track -- the same
# stability, bought once and permanently rather than borrowed under load, and
# without cambering the wheels 24 deg to get it. Measured, that is not a wash
# but a clear gain: see widen_max, and Measured behaviour in the README.
#
# THE THREE TIME SCALES
#
#   command    the governor, 50 Hz. Refuses twists outside the measured
#              envelope. Nothing else in the stack does this, and it is what
#              makes commanded-motion rollovers essentially impossible.
#   fast       body tilt through differential leg length, 100 Hz. Rejects
#              terrain, and is low-passed as a whole -- see roll_kd for what
#              happened when the rate term was left unfiltered.
#   slow       stance width and ride height. Asymmetric: 0.30 m/s going wide,
#              0.20 m/s coming back, because scrubbing the wheels is worth it
#              quickly to avoid a rollover and not at all to look tidy. Both
#              fade out below walking pace, where the hips cannot drag a loaded
#              wheel sideways at all (see reshape_roll_speed).

magi_stabilizer:
  ros__parameters:
    use_sim_time: true

    rate: 100.0
    # The dominant lag in the fast path. Each message supersedes the last, so
    # the trajectory controller treats this as a first-order time constant
    # rather than a deadline. 0.03 against the old node's 0.05 is most of the
    # bandwidth recovered.
    command_horizon: 0.03
    controller: leg_controller

    # The governor sits IN the command path. Teleop and navigation publish to
    # cmd_in; the wheel controller listens to cmd_out. Nothing else may write
    # cmd_out while this node is running.
    cmd_in: /cmd_vel
    cmd_out: /wheel_controller/cmd_vel_unstamped

    # 0.36, not 0.40. Ride height is the one lever that raises BOTH tipping
    # angles at once, because both are atan(half-dimension / h_com) and only
    # h_com is free:
    #
    #                          h_com    roll tip   pitch tip
    #   ride 0.40 (was)        0.311      31.4       31.9 deg
    #   ride 0.36 (here)       0.271      35.0       35.5 deg
    #
    # Measured over the standard course, 8 s per leg: at 0.40 the robot covers
    # 3.23 m and finishes upright 18/29; at 0.36 it covers 2.57 m and finishes
    # upright 9/11. Twenty points of upright rate for twenty percent of the
    # distance is the better end of that trade on this terrain. (The 0.36
    # figure is one pass of the course against three for 0.40 -- the direction
    # is geometry, the exact numbers are one sample.)
    #
    # It costs ground clearance, which on Rubicon is the expensive currency:
    # the belly sits 0.303 m up instead of 0.343 m. That still clears every
    # obstacle the robot can drive over anyway. Raise it back with
    #   ros2 topic pub --once /magi/body_height std_msgs/msg/Float64 "{data: 0.40}"
    ride_height: 0.36
    stand_time: 2.5
    startup_delay: 2.0
    # The attitude loop fades in over this long rather than switching on. A step
    # from no authority to full applies whatever error accumulated during the
    # stand-up as one impulse, which on Rubicon unloaded two wheels by itself.
    authority_ramp: 0.75

    # --- attitude loop ---------------------------------------------------
    # The reference is "body z along EFFECTIVE gravity", taken straight off the
    # accelerometer. That single signal is the slope levelling and the
    # cornering lean and the response to a terrain impulse, so there is no
    # separate feed-forward term here and no v*w model to be wrong about.
    #
    # Gains are dimensionless: 1.0 would command the whole measured error as a
    # body rotation in one cycle.
    roll_kp: 0.75
    roll_ki: 0.60
    # 0.05, not 0.09. See the note in the node: the rate term acts through the
    # command horizon, the leg controller and the ~20 Hz roll mode of the body
    # on the hip PD, and at 0.09 with no filter on it the loop sustained a
    # 19.5 Hz limit cycle at 3.9 rad/s rms -- +/-200 m/s^2 at the IMU, on a
    # robot standing still. Everything that reads the accelerometer went with
    # it. 0.05 through the command_tau pole below is damping in the band that
    # matters and nothing at the mode.
    roll_kd: 0.05
    pitch_kp: 0.55
    pitch_ki: 0.50
    pitch_kd: 0.05
    tilt_i_max: 0.15
    tilt_max: 0.35
    # Low-pass on the WHOLE command now, rate term included, at 3.2 Hz. The
    # previous version filtered P+I only and left D undelayed, which is the
    # right instinct for a plant that can follow a rate command and the wrong
    # one for this plant, which cannot: the loop was unstable at 19.5 Hz.
    # Terrain disturbances are a few Hz at most, so this costs the loop nothing
    # it was actually using.
    command_tau: 0.05
    gyro_tau: 0.05
    # The accelerometer is the reference sensor now, so its filter matters.
    # Short enough to keep terrain impulses (a few Hz at most), long enough to
    # reject the MEMS noise floor and the 0.05 m lever arm to the IMU mount.
    # 0.20, not 0.06. Since the fast attitude path now runs off the quaternion,
    # the accelerometer only feeds slow consumers -- the lean reference and the
    # stability margin -- and both want it heavily filtered. At 0.06 every wheel
    # crossing a Rubicon facet swung the measured gravity direction enough to
    # make the margin look like it was collapsing.
    accel_tau: 0.20
    # The lean reference -- the inertial part of the measured gravity direction,
    # i.e. what is left once the true attitude is taken out. It has to be SLOW.
    # Fed to the loop unfiltered, an accelerometer reports the legs' own push on
    # the body as tilt, the loop tilts further to "correct" it, and that pushes
    # harder: measured on FLAT ground standing still, two wheels unloaded within
    # a second and the robot was inverted a few seconds later. A real lean
    # demand -- a corner, a slope, a sustained side force -- is slow.
    lean_tau: 0.40
    lean_max: 0.25
    # Accelerometer bias estimation. At rest the inertial part of the measured
    # gravity direction is zero by construction -- whatever the slope, a body at
    # rest reads gravity and only gravity -- so anything left over is bias, and
    # rest is exactly when it is observable. It has to come out: the URDF models
    # 0.1 m/s^2 of bias_mean, which is 0.58 deg of phantom lean that the loop
    # will hold the body at indefinitely. Measured standing on flat ground,
    # before this existed: roll 0.77 / pitch 0.98 deg rms, against 0.04 / 0.06
    # with the lean reference switched off altogether.
    accel_bias_tau: 8.0
    accel_bias_max: 0.05

    # --- margin-driven CoM bias -------------------------------------------
    # Below bias_margin the body leans directly AWAY from whichever support
    # edge it is closest to going over, on top of the levelling loop. This is
    # "keep the centre of gravity inside the triangle" in its most literal
    # form -- it moves the CoM rather than waiting for the attitude error to
    # grow enough to move it.
    bias_margin: 0.30    # rad, 17 deg
    bias_gain: 0.6
    bias_max: 0.10       # rad, 5.7 deg of extra lean

    # --- prediction --------------------------------------------------------
    # Body rates integrated forward this far, and the margin re-evaluated
    # there. A rollover is divergent: the static margin is still comfortable
    # at the moment the outcome is already decided, so every consumer uses
    # min(now, predicted).
    predict_time: 0.12
    # And CLAMPED. Body rates spike to 1-2 rad/s whenever a wheel crosses a
    # facet; unclamped, a 0.2 s lookahead turns each spike into 17 deg of
    # "predicted" rotation, so the margin reads as collapsing several times a
    # second on terrain the robot is handling fine. Throttled to a crawl by its
    # own jitter, it then rolled at 0.5 m/s where the old node drove 2.7 m
    # without noticing. Predict, but do not panic.
    predict_max: 0.12

    # --- reshaping ---------------------------------------------------------
    # 0.30, not 0.60. Going wide fast is the whole point of an asymmetric rate
    # limit, but the wheels have to scrub sideways to do it and there is a speed
    # past which the scrub is itself the disturbance: at 0.60 m/s the stance
    # slammed 0.380 -> 0.600 m in 0.18 s with all four wheels planted, and that
    # lateral impulse threw the robot on Rubicon every time. 0.30 still reaches
    # full width in 0.37 s, against 1.8 s for the old node's symmetric 0.12.
    reshape_rate_up: 0.30
    # 0.20, not 0.10. Coming back in used to take 1.1 s of lever travel on top
    # of ~1.2 s of urgency decay, so the stance never finished recovering
    # between two terrain events and simply lived at its limit. The asymmetry
    # is still there and still deliberate; it is just no longer a ratchet. Safe
    # now that reshape_roll_speed below stops it being attempted at rest, where
    # narrowing is friction-locked anyway.
    reshape_rate_down: 0.20
    # The width lever only exists while the wheels are turning. Dragging four
    # loaded wheels sideways costs mu*N through the stance height -- 17.3 N.m
    # at the hip -- plus the splay moment, against a 23.7 N.m hip limit, so at
    # rest the stance is friction-locked: measured, the front hips sat pinned
    # at exactly 23.700 N.m and the splay did not move at all while standing,
    # and came back to nominal within six seconds of rolling. Below
    # reshape_roll_speed the rate fades to reshape_rest_gain of itself, and
    # widen_band keeps the commanded width within reach of the achieved one so
    # the hip PD never saturates on a difference it cannot close.
    reshape_roll_speed: 0.30
    reshape_rest_gain: 0.35
    # 15 mm, and that number comes straight off the hip gain. Half-track moves
    # 0.222 m per radian of hip at this stance, so 15 mm of width is 0.068 rad,
    # which at p = 200 is 13.5 N.m of hip effort against a 23.7 N.m limit. A
    # 30 mm band is 27 N.m all by itself and saturates the joint, which is the
    # state this clamp exists to prevent; much below 15 mm and the stance can
    # no longer lead the terrain at all.
    widen_band: 0.015
    # 0.25 rad (14 deg), not 24. On Rubicon the robot genuinely stands on three
    # wheels much of the time, and a triangle's margin is well under the 31 deg
    # a square gives -- so a 24 deg target meant the stance was permanently
    # "urgent", sat half-splayed doing nothing useful, and hunted.
    margin_target: 0.25
    margin_tau: 0.20
    # 0.80 and 1.50, not 0.25 and 0.70/1.20. "Widen when moving fast" is sound
    # and this was the term that made the robot splay ALL THE TIME: at 0.25 to
    # 1.20 a perfectly ordinary 1.0 m/s put u_speed at 0.79, so on FLAT GROUND,
    # with nothing wrong, the robot drove with its track at 0.554 m against a
    # 0.380 m nominal and its body 7 cm below its ride height. Measured, and
    # reproducible either way round:
    #
    #                       track     ride     urgency
    #   0.25 / 1.20         0.554    0.290       0.79
    #   0.80 / 1.50         0.443    0.346       0.29
    #
    # at an identical 0.97 m/s of ground speed. Widening belongs at the top of
    # the speed range, not at a walking pace -- and the anticipation it was
    # standing in for is better done by u_cmd, which compares the commanded
    # lateral demand against the measured envelope, and measures 0.00 mean
    # because the governor never lets a turn get near the limit.
    speed_calm: 0.80
    # 1.20, not 0.70. "Go wide when moving fast" is sound, but 0.70 m/s is not
    # fast for this machine and the term alone held the stance at full splay
    # for any useful speed. Splaying is not free: at 0.110 m of widen the hips
    # are out 23 deg, so the wheels are cambered 23 deg and roll on their rim
    # edges, and the hips then have to drag them back in against mu*N -- which
    # at 48 N per wheel through a 0.4 m stance is 19 N.m against a 23.7 N.m
    # limit, i.e. barely feasible. Now that the acceleration envelope is
    # measured correctly (it was pinned at its floor by a sign error), the
    # governor is what protects a fast turn, and the stance can stay narrow
    # until the speed genuinely warrants it.
    speed_wide: 1.50
    # 0.90 rad/s of body-rate RMS, not 0.35. This term feeds BOTH the stance
    # width and the governor's speed ceiling, so saturating it costs speed
    # twice over -- and 0.35 saturates on ordinary Rubicon at any useful pace.
    # Part of that was self-inflicted: the attitude loop's own 19.5 Hz limit
    # cycle put 3.9 rad/s into this estimate while the robot stood still. With
    # the loop stable the figure is 0.005 rad/s at rest and 0.2-0.8 driving, so
    # 0.90 marks genuinely violent ground rather than merely textured ground.
    rough_ref: 0.90
    rough_tau: 1.0
    # Residual gyro noise after gyro_tau, removed in quadrature so a motionless
    # robot reports zero roughness instead of its own noise floor.
    rough_floor: 0.080
    # 0.070, not 0.110. The wide stance was not paying for itself. Splaying to
    # 0.110 cambers the wheels ~24 deg and rolls them onto their rim edges, and
    # measured over the standard course that cost more contact than the extra
    # geometric tipping angle bought:
    #
    #                          widen 0.110    widen 0.070
    #   track, median              0.482 m        0.466 m
    #   track above 0.55 m            34 %            0 %
    #   fewer than three feet         16 %            9 %
    #   tip margin, median          31.3 deg       35.6 deg
    #   ground covered per run      2.46 m         2.92 m
    #
    # Every column moves the right way, including the two that were supposed to
    # be the reason for splaying in the first place. Less camber means the
    # wheels stay on the ground, and a support pattern that keeps four contacts
    # beats a wider one that keeps three.
    #
    # It costs less than it looks on paper, too, because ride_height already
    # banked most of it: at h_com 0.271 the nominal stance tips at 35.0 deg and
    # widen 0.070 takes that to 45.2 deg, against 49.7 deg at 0.110.
    widen_max: 0.070
    # 0.090, and gated on smoothness. Crouching is the only lever that costs
    # ground clearance, and the cost has been measured: the old node at
    # crouch_max 0.10 reached 0.30 m ride height on Rubicon, grounded out, and
    # three feet fell to ~5 N against 191 N of weight -- it dug itself in and
    # covered 0.3 m in 10 s of commanded driving. So the crouch is available in
    # full on smooth ground, where it buys cornering stability and nothing is
    # going to hit the belly, and withdrawn as the terrain roughens.
    # 0.050, not 0.090. Stacked on the 0.36 ride height this used to put the
    # body at 0.27 m -- measured, the robot spent 26% of a course below 0.32 m
    # and 9% below 0.30 m, which is the "it gets too low" complaint and is also
    # where grounding out starts. Most of what the crouch was buying is now
    # permanent: ride_height came down from 0.40 to 0.36, which is 40 mm of CoM
    # height taken off the top rather than borrowed under load. 0.050 keeps the
    # lever without spending clearance the terrain wants. After the change:
    # 1% of the course below 0.32 m, none below 0.30.
    crouch_max: 0.050
    crouch_rough_gate: 0.60
    # The opposite lever. With fewer than three feet loaded the legs extend to
    # chase the surface instead of crouching further into it.
    reach_max: 0.050
    # Reach moves the ride height, so it is the lever that shows up as the body
    # bouncing -- the width levers move sideways, where nothing is stacked on
    # top. It gets its own slower rate, and contact loss is debounced before it
    # acts at all: an instantaneous feet<3 test made it chase the fourth wheel
    # flickering across the 5 N threshold, +/-50 mm at a time, which by itself
    # took the body rate from 0.006 to 0.13 rad/s rms standing still.
    reach_rate: 0.06
    contact_debounce: 0.35

    # Urgency drives levers that move real mass, and every input to it is noisy.
    # Rise quickly, fall slowly -- the same asymmetry as the rate limits.
    urgency_rise_tau: 0.15
    # 0.80, not 1.20. Rise fast and fall slow is right, but 1.2 s of decay on
    # top of the reshape rate meant a single contact flicker held the stance
    # out for well over two seconds, and on this terrain the next flicker
    # arrives before that finishes. Still four times slower to relax than to
    # react.
    urgency_fall_tau: 0.80

    dz_max: 0.110
    contact_force: 5.0
    # How long a wheel still counts as support after its load drops below the
    # threshold. Driving over Rubicon unloads a wheel constantly -- a facet edge
    # does it and the wheel is back down hundredths of a second later -- and
    # every one of those drops the pattern under three contacts, where the
    # margin is not "small" but hugely negative, because two-point support IS
    # geometrically a tipover. Unheld, the measure read -35 deg on a robot
    # upright at 10 deg of roll and pinned the governor at its crawl floor: it
    # "survived" by covering 0.24 m in 8 s. The hold is shorter than the time
    # any lever takes to act, so nothing is decided on a contact truly gone.
    contact_hold: 0.25
    # 0 means resolve the sign of the foot force sensors at runtime from the
    # robot's own weight, rather than trusting the measure_direction tag.
    force_sign: 0.0

    # --- governor ----------------------------------------------------------
    governor_enable: true
    governor_rate: 50.0
    # The envelope is defined as "the acceleration that would bring the margin
    # down to tip_margin_safe", so this is the reserve deliberately held back
    # for the terrain rather than spent on cornering. 16 deg of the ~31 deg a
    # nominal stance has, or of the ~46 deg a splayed one has.
    # 0.20 rad (11.5 deg) of the ~31 deg a nominal stance has. Held back for the
    # terrain rather than spent on cornering. Larger is not automatically safer:
    # at 16 deg the reserve ate so much of the envelope that the robot refused
    # to turn at all on any real slope.
    tip_margin_safe: 0.20
    # Below this the command is pulled toward zero rather than merely capped.
    # At 7 deg of margin the legs are not going to save it and continuing to
    # drive is what finishes the rollover.
    tip_margin_crit: 0.12   # rad, 7 deg
    v_max: 1.5
    w_max: 1.5
    accel_max: 1.5
    yaw_accel_max: 2.0
    cmd_timeout: 0.5
    # Never govern below this lateral acceleration: without a floor, a
    # momentary bad margin reading would refuse all motion, including the
    # motion needed to drive off whatever caused it.
    a_lat_floor: 0.8
    a_lat_ceiling: 12.0
    # Speed ceiling over fully rough ground. This is the one limit not derived
    # from the tipping envelope, because the envelope only knows the ground the
    # wheels are on right now -- it cannot see the impulse coming.
    #
    # 0.60, not 0.35. With the roughness estimate pegged this was the robot's
    # actual top speed everywhere on Rubicon, which is why it read as "hardly
    # navigates". The estimate is honest now, so this applies to genuinely
    # broken ground -- and 0.35 m/s is slower than the real machine crosses
    # that, while still being a crawl next to the 1.5 m/s ceiling.
    v_rough_min: 0.60
    # Speed still permitted with no margin left. NOT zero: a robot out of margin
    # is usually a robot on a slope, and driving off it is the way out. Zeroing
    # the command instead pinned it where it got into trouble, still sliding,
    # unable to accept any command that would have taken it somewhere flatter.
    v_crit_min: 0.25
    # ...unless it is not on a slope but going over. Same critical margin,
    # opposite right answer: there the drive torque is what completes the
    # rollover, and the crawl floor above keeps applying it. Body rate is the
    # discriminator -- a slope is static, a rollover is not -- and 1.5 rad/s
    # sits above the 1-2 rad/s spikes a wheel crossing a facet produces while
    # the robot is coping. Forward drive is cut for tip_stop_hold; reverse is
    # still allowed, because backing off whatever was hit is the way out.
    tip_stop_rate: 1.5
    tip_stop_hold: 0.6
    # And the wheelie latch. With mu 1.0, a CoM 0.311 m up and 0.1934 m of
    # half-wheelbase, full tractive effort pitches this robot back harder than
    # its wheelbase restores -- the no-wheelie condition is mu < 0.62, and mu
    # is 1.0 because hill climbing needs it. A blocked front wheel is what
    # reaches that: the rear wheels push into a wheel that cannot roll and
    # stand the robot on its tail. Measured, it went from -7 to -84 deg of
    # pitch in one second with the governor still commanding 1.00 m/s, because
    # the tipping envelope is a steady-state measure and a wheelie is not.
    # Both front wheels off the ground under a forward command is the signal.
    # --- the rear-up guard -------------------------------------------------
    # The pitch twin of the 31.4 deg roll figure at the top of this file:
    # atan(half_wheelbase / h_com) = atan(0.1934/0.311) = 31.9 deg of nose-up
    # is where the CoM passes behind the rear contacts. There is no lever
    # against it -- widening is a roll remedy and the wheelbase is fixed -- so
    # the only answer is to stop climbing.
    #
    # 0.35 rad (20 deg) arms it and 0.50 rad/s of FURTHER nose-up fires it.
    # Both conditions are needed: entering a 25 deg slope pitches fast but only
    # to 25 deg, and sitting on one is steep but no longer rotating. Only a
    # rear-up is steep and still steepening. On the leg that used to fail 3/3
    # this fires at about 22 deg, half a second before the point of no return.
    rear_pitch: 0.35
    rear_rate: 0.50
    pitch_rate_tau: 0.10
    rear_stop_hold: 0.8
    # Low-pass on the mean wheel drive torque reported in /magi/balance_state.
    # Diagnostic only, but a load-bearing one: it is what ruled out "the wheels
    # are grinding against a rock" as the cause of the rear-ups (1.1 N.m of
    # 23.7 while it happened -- the robot was climbing, not pushing).
    drive_tau: 0.20

    # --- terrain preview ---------------------------------------------------
    # A plane fit to the lidar returns ahead of the robot. Widening takes
    # ~0.2 s at the rate limit and crouching longer, and a bump met at 1 m/s
    # arrives with no warning at all from the IMU -- which only ever reports
    # terrain the robot has already hit. The lidar sees it well ahead of that.
    #
    # The window has to sit where the ground actually is. The MID-360 is
    # mounted 0.232 m forward and 0.104 m above base with 0.08 rad (4.58 deg)
    # of downward pitch, and it only looks 7 deg below its own horizon, so
    # from 0.504 m up the lowest ray is 11.58 deg down and first reaches the
    # ground 2.69 m out; the next rings land at 3.18, 3.92 and 5.13 m.
    # 2.6-5.4 m therefore catches four ground rings (~200 points), which fits
    # a well-conditioned plane. Note this is still terrain several metres
    # ahead rather than the ~1.5 s of lead the original close window assumed,
    # so the preview anticipates earlier than the gains below were tuned for.
    preview_enable: true
    preview_near: 2.60
    preview_far: 5.40
    preview_half_width: 0.80
    preview_tau: 0.30
    # 0.10 m of residual about the fitted QUADRATIC surface, not 0.045 about a
    # plane. Two changes, one number. The plane fit scored a hill's curvature
    # as roughness -- median 5.3 cm of residual on merely sloped ground, p90
    # 16.5 cm, measured over 600 random placements -- so against 0.045 the
    # preview read FULLY ROUGH over 57% of Rubicon and never came back down.
    # The quadratic fit leaves only texture (median 3.4 cm, p90 8.6 cm), and
    # 0.10 puts full urgency where ~7% of the map genuinely is broken ground
    # instead of where most of it merely tilts.
    preview_rough_ref: 0.10
    # The datasheet range precision, removed in quadrature. Without it a fit to
    # flat ground reports ~0.7 cm of "roughness" that is pure sensor noise,
    # which held the stance part-widened while standing still.
    preview_rough_floor: 0.020
    # Upcoming slope that counts as fully urgent, referenced to the angle the
    # robot actually tips at (31 deg nominal, 46 deg splayed) rather than the
    # 0.35 rad that used to be hard-coded in the node. Rubicon's slope at the
    # robot's own footprint scale is p50 11 deg, p75 19 deg, p90 34 deg, so a
    # 20 deg reference meant a quarter of the map was permanently "urgent".
    preview_slope_ref: 0.60
    # How far ahead in TIME the preview is allowed to act. The window sits
    # 2.6-5.4 m out because the lidar cannot see the ground any closer, so at a
    # walking pace its centre is eight seconds away -- and in a basin ringed by
    # steep ground, something steep is always inside it. Ungated, that alone
    # held the stance at full splay and the speed at the roughness floor no
    # matter where the robot was or whether it was moving. 3 s is comfortably
    # longer than the 0.4 s the stance takes to widen and the 1 s or so the
    # governor needs to shed speed.
    preview_lead: 3.0
