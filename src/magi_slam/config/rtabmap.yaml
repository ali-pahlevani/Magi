# RTAB-Map configured for 3D lidar SLAM on the MAGI Go2W.
#
# ---------------------------------------------------------------------------
# Where this sits in the TF chain
# ---------------------------------------------------------------------------
#   map  -> odom     published HERE, by rtabmap. The loop-closure correction.
#   odom -> base     published by the Phase 2 EKF. Untouched.
#
# RTAB-Map is deliberately NOT run with icp_odometry. rtabmap_odom's
# icp_odometry would publish odom -> base itself and fight the EKF for it, and
# the EKF already fuses wheel vx, IMU attitude/rates and leg-kinematics vz.
# Instead rtabmap consumes /odometry/filtered as its odometry source and only
# adds the map -> odom correction on top. One publisher per transform.
#
# The consequence to keep in mind: RTAB-Map inherits whatever the EKF gets
# wrong between loop closures. EKF yaw is gyro-integrated with no absolute
# reference and drifts; odom z is terrain-relative and does not track the
# terrain's 5 m of relief. Both are exactly what loop closure exists to absorb,
# which is why Reg/Force3DoF is false: the correction has to be full 6-DoF.

rtabmap:
  ros__parameters:
    use_sim_time: true

    # base_footprint, NOT base. RTAB-Map anchors the map frame on the pose of
    # this frame at the first keyframe, so whatever it names becomes z = 0 of
    # the map. `base` sits a whole ride height off the floor, which put the
    # datum at chest height: the /map occupancy grid (a nav_msgs/OccupancyGrid,
    # whose origin.position.z is always 0) was drawn by RViz as a flat plane
    # 0.35 m in the air, cutting through the robot with its wheels hanging
    # below it. The 3D cloud was never wrong -- checked against the simulator's
    # own heightmap, its ground returns land within 0.03 m of the true surface
    # -- and neither was the robot. Only the datum was.
    #
    # base_footprint is a rigid link 0.36 m below base, defined in
    # magi_go2w.urdf.xacro; see the note there for why it is rigid rather than
    # a tracked projection.
    frame_id: base_footprint
    map_frame_id: map
    # Empty => take odometry from the /odom TOPIC (remapped to
    # /odometry/filtered in the launch file) rather than from TF, so rtabmap
    # gets the EKF's covariance rather than assuming a default.
    odom_frame_id: ""

    # Lidar only. No camera is fused: the Go2's front camera is a 120 deg
    # pinhole with no depth, so it contributes nothing to a 3D lidar map.
    subscribe_depth: false
    subscribe_rgb: false
    subscribe_scan: false
    subscribe_scan_cloud: true
    subscribe_odom_info: false

    approx_sync: true
    queue_size: 20
    # 2.0, not 0.5. This is how long the scan-to-base conversion will wait for
    # TF before giving up, and giving up is not recoverable: a single "Could
    # not convert 3d laser scan msg" during startup left rtabmap running but
    # permanently silent -- no graph nodes, no /cloud_map, no map -> odom, and
    # no further errors to say so. Started by hand against an already-warm
    # simulation the identical configuration mapped fine, which is what
    # identified this as a race rather than a configuration problem.
    wait_for_transform: 2.0
    publish_tf: true
    database_path: ~/.ros/magi_rtabmap.db

    # ---- registration --------------------------------------------------
    # 1 = ICP. There are no visual features to register on in a lidar-only
    # pipeline, so the default visual strategy would never find a link.
    Reg/Strategy: "1"
    # Full 6-DoF. Rubicon has 5 m of relief and the robot pitches and rolls
    # several degrees while driving; constraining to 3-DoF would fight it.
    Reg/Force3DoF: "false"

    Icp/PointToPlane: "true"
    Icp/PointToPlaneK: "20"
    Icp/PointToPlaneRadius: "0"
    # 10 cm voxels: the scan is 23,040 points at 10 Hz, and matching raw is
    # both slow and unnecessary given the terrain's scale.
    Icp/VoxelSize: "0.1"
    Icp/MaxCorrespondenceDistance: "1.0"
    Icp/Iterations: "10"
    Icp/Epsilon: "0.001"
    Icp/CorrespondenceRatio: "0.2"
    Icp/MaxTranslation: "3.0"
    # The lidar sits ~0.10 m above base, 0.23 m forward, with a -7..+52 deg
    # vertical FOV and 4.58 deg of downward pitch, so it looks outward and up
    # rather than at the robot. This trims any residual self-returns off the
    # legs and head regardless.
    Icp/RangeMin: "0.6"

    # ---- graph / memory ------------------------------------------------
    Mem/IncrementalMemory: "true"      # SLAM (mapping). Set false to localise.
    Mem/STMSize: "30"
    Mem/LaserScanNormalK: "20"
    RGBD/ProximityBySpace: "true"
    RGBD/ProximityMaxGraphDepth: "0"
    RGBD/ProximityPathMaxNeighbors: "1"
    RGBD/AngularUpdate: "0.05"
    RGBD/LinearUpdate: "0.05"
    RGBD/OptimizeFromGraphEnd: "false"
    RGBD/NeighborLinkRefining: "true"

    # ---- occupancy grid ------------------------------------------------
    # The map is volumetric. Two topics come out of the same graph:
    #   /cloud_map   the 3D point cloud, with real vertical structure
    #   /map         a 2D projection of it, which is what Nav2 will want
    # Setting this false would flatten the map at the source, and there would
    # be no 3D structure left to project from or to display.
    # Verified on Rubicon: 20,359 points spanning z -0.52..+1.70 m (2.22 m
    # spread, sd 0.58).
    #
    # An earlier note here read a -0.204 m z term in map->odom as evidence of a
    # genuinely 6-DoF correction. Treat that with suspicion: with the datum
    # fixed and one rtabmap running, map->odom z sits at 0.000 (sd 0.000)
    # standing still and +0.011 after nine metres of driving. A correction of
    # that size was the frame offset being taken out, not loop closure.
    Grid/3D: "true"
    Grid/Sensor: "0"                   # build the grid from the lidar cloud

    # RAY TRACING. Not optional here, and the single most important line in
    # this file for anything that plans on the 2D grid.
    #
    # With it off (the default), a cell becomes free only if a GROUND point
    # lands in it. On rocky terrain most beams land on rock, so most cells
    # never get a ground point and stay occupied or unknown -- including the
    # ground the robot is standing on. Measured on a 28 m mapping run over
    # Rubicon, comparing the grid against the 88 poses the robot physically
    # occupied:
    #
    #                                    ray tracing off     on
    #   driven cells marked free                 51%       100%
    #   driven cells marked OCCUPIED             34%         0%
    #   free-space clearance at those cells    0.10 m      2.86 m
    #   largest drivable region (0.38 m robot)  1.4 m2   364 m2
    #
    # The robot's own start cell was blocked in its own map. Nav2 could not
    # have planned a single metre of that map, and no amount of costmap tuning
    # would have fixed it, because the fault was upstream of the costmap.
    #
    # Checked against the simulator's terrain rather than against itself: with
    # ray tracing off, cells the map called free and cells it called occupied
    # were statistically the same terrain -- 72.8% vs 70.9% genuinely drivable,
    # median true slope 11.0 vs 10.9 deg. The obstacle layer carried no
    # information. With it on, occupied cells are real: 90th-percentile true
    # slope 51 deg against 33 deg for free ones.
    Grid/RayTracing: "true"

    Grid/CellSize: "0.1"
    Grid/RangeMin: "0.6"
    # 10 m, halved from 20. Ray tracing believes a beam that skims a rise and
    # lands beyond it, and the further the beam travels the more terrain it can
    # skim. Trimming the range keeps the free space to where the geometry was
    # actually resolved; on the same run it cost 25% of the mapped area and
    # bought a visibly better map -- occupied cells went from 72.8% to 66.6%
    # genuinely drivable, i.e. fewer of them were drivable ground wrongly
    # called an obstacle.
    Grid/RangeMax: "10.0"
    Grid/ClusterRadius: "0.5"
    Grid/GroundIsObstacle: "false"
    # Rubicon is rocky and genuinely steep; a stricter angle would paint most
    # of the drivable basin as obstacle.
    Grid/MaxGroundAngle: "45"
    Grid/MaxObstacleHeight: "1.5"
    Grid/NormalsSegmentation: "true"
    GridGlobal/MinSize: "20.0"
